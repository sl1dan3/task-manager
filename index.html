<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Личный список задач на каждый день.">
  <title>Сегодня — Task Manager</title>
  <link rel="stylesheet" href="src/styles/styles.css">
  <script src="src/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К задачам</a>
  <div class="app">
    <header class="app__mobile-header">
      <button class="icon-button" type="button" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false" data-js-menu-toggle><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="app__mobile-title">Task Manager</span>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Панель навигации" data-js-sidebar>
      <div class="sidebar__header">
        <span class="sidebar__brand"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 2 2 4-4M12 6h8M4 13l2 2 4-4M12 13h8M4 20h16"/></svg><span class="visually-hidden">Task Manager</span></span>
        <button class="icon-button sidebar__close" type="button" aria-label="Закрыть меню" data-js-menu-close><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <button class="sidebar__add" type="button" data-js-add-task="sidebar"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Добавить задачу</span></button>
      <nav aria-label="Разделы и фильтры задач">
        <ul class="sidebar__nav">
          <li><button class="sidebar__nav-button" type="button" data-js-nav="search"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg><span>Поиск</span></button></li>
          <li><button class="sidebar__nav-button" type="button" data-js-nav="inbox"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4-3 12v4h20v-4L19 4ZM2 16h6l2 3h4l2-3h6"/></svg><span>Входящие</span></button></li>
          <li><button class="sidebar__nav-button sidebar__nav-button--active" type="button" data-js-nav="today" aria-current="page"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3v3H8z"/></svg><span>Сегодня</span></button></li>
          <li><button class="sidebar__nav-button" type="button" data-js-nav="upcoming"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h1m3 0h1m3 0h1M7 12h1m3 0h1m3 0h1M7 17h1m3 0h1m3 0h1"/></svg><span>Предстоящее</span></button></li>
          <li><button class="sidebar__nav-button" type="button" data-js-nav="filters"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg><span>Фильтры и метки</span></button></li>
        </ul>
      </nav>
    </aside>
    <button class="app__backdrop" type="button" aria-label="Закрыть меню" tabindex="-1" data-js-menu-backdrop></button>
    <main class="todo" id="main" tabindex="-1">
      <div class="todo__inner">
        <header class="todo__header">
          <h1 class="todo__title" data-js-heading>Сегодня</h1>
          <p class="todo__summary"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span data-js-todo-count aria-live="polite" aria-atomic="true">0 задач</span></p>
        </header>
        <ul class="todo__list" aria-label="Список задач" data-js-todo-list></ul>
        <div class="todo__empty" data-js-empty-state>
          <p class="todo__empty-title">На сегодня задач пока нет</p>
          <p class="todo__empty-text">Добавьте первую задачу, чтобы начать день с плана.</p>
        </div>
        <button class="todo__add" type="button" data-js-add-task="main"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Добавить задачу</span></button>
        <form class="task-form" hidden data-js-todo-form aria-labelledby="task-form-title" novalidate>
          <h2 class="task-form__title" id="task-form-title">Новая задача</h2>
          <label class="task-form__label" for="task-title">Название задачи</label>
          <input class="task-form__input" id="task-title" name="title" type="text" placeholder="Что нужно сделать?" required aria-describedby="task-error" data-js-task-input>
          <p class="task-form__error" id="task-error" aria-live="polite" data-js-task-error></p>
          <div class="task-form__actions">
            <button class="button" type="button" data-js-form-cancel>Отмена</button>
            <button class="button button--primary" type="submit" data-js-form-submit>Добавить</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <template data-js-todo-template>
    <li class="todo-item" data-js-todo-item>
      <input class="todo-item__checkbox" type="checkbox" aria-label="Отметить задачу выполненной" data-js-task-toggle>
      <span class="todo-item__title" data-js-task-title></span>
      <div class="todo-item__actions">
        <button class="icon-button" type="button" aria-label="Редактировать задачу" data-js-task-edit><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5 5 5M4 20l5-1L21 7l-5-5L4 14Z"/></svg></button>
        <button class="icon-button" type="button" aria-label="Удалить задачу" data-js-task-delete><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>
      </div>
    </li>
  </template>
</body>
</html>
